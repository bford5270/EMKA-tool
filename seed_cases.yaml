# EMKA Gold-Standard Evaluation — Seed Cases
# ------------------------------------------------------------------------------
# Source of truth for what the retrieval/generation stack must get right.
# Referenced by the eval harness (see docs/EMKA_Build_Prompts.md, Prompt 11).
#
# SCHEMA (per case)
#   id                  Stable case ID.
#   role                IDC | Role2 | Planner | DNBI  (primary user population)
#   category            Clinical/doctrinal topic.
#   question            The plain-language query as a user would type it.
#   expected_behavior   answer | abstain
#   expected_source_ref Manifest Ref ID(s) that SHOULD appear in retrieval (recall@10).
#   expected_source     Human-readable title of that source.
#   expected_citation   The section/paragraph the answer should cite (citation accuracy).
#   answer_must_include Key elements a grounded answer must contain (grounded-answer rubric).
#                       Concept-level, not verbatim. Exact numeric values flagged in sme_verify.
#   exercises           Behaviors this case tests: retrieval | citation | grounded_answer |
#                       abstention | conflict_handling | resource_matching | capability_limit
#   difficulty          standard | hard | adversarial
#   sme_verify          Items the SME custodian MUST confirm against the cited source before
#                       this case is authoritative. Precise doses/timings live here on purpose —
#                       a wrong "expected answer" is worse than none.
#   context             (optional) Availability/loadout facts for resource_matching cases.
#
# GOVERNANCE: This is a SEED set (30 cases) to bootstrap the harness. The clinical SME
# panel expands it toward the ~200-case target and validates every sme_verify item.
# Editions/section numbers below reflect the corpus manifest; confirm at ingest.
# ------------------------------------------------------------------------------

metadata:
  version: 0.1-seed
  authored: 2026-07
  target_case_count: 200
  seed_case_count: 30
  thresholds:            # harness fails (non-zero exit) if any metric falls below these
    retrieval_recall_at_10: 0.95
    citation_accuracy: 0.99
    verbatim_quote_integrity: 1.00
    grounded_answer_rate: 0.98
    honest_abstention_rate: 0.95
    latency_seconds_max: 30

cases:

# ============================ IDC / ROLE 1 ====================================

- id: EMKA-EVAL-001
  role: IDC
  category: Hemorrhage
  question: "When do I give TXA to a casualty and how soon does it need to happen?"
  expected_behavior: answer
  expected_source_ref: [CPG-01, CPG-03]
  expected_source: "TCCC Guidelines; Damage Control Resuscitation CPG"
  expected_citation: "TCCC Guidelines — TXA administration section"
  answer_must_include:
    - "indicated for casualties with or at risk of significant hemorrhage / anticipated massive transfusion"
    - "give as early as possible after injury; there is a time window beyond which it is not recommended to initiate"
    - "administered as an infusion, not a rapid IV push"
  exercises: [retrieval, citation, grounded_answer]
  difficulty: standard
  sme_verify:
    - "exact dose and whether current TCCC uses a single-dose vs two-dose regimen"
    - "the exact time window for initiation (hours from injury)"

