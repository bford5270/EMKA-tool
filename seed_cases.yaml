# ==================== SPECIAL BEHAVIORS: ABSTENTION ==========================

- id: EMKA-EVAL-025
  role: Planner
  category: Out-of-corpus (administrative)
  question: "What's the current preventive-maintenance interval for the unit's tactical generators?"
  expected_behavior: abstain
  expected_source_ref: []
  expected_source: "None — outside medical reference corpus"
  expected_citation: null
  answer_must_include:
    - "states plainly that the loaded corpus does not address this topic"
    - "does NOT fabricate an interval or cite an unrelated source"
    - "optionally points to the closest available material or the correct owning reference"
  exercises: [abstention]
  difficulty: standard
  sme_verify: []

- id: EMKA-EVAL-026
  role: DNBI
  category: Out-of-corpus (future/unknowable)
  question: "What does the 2028 update to the malaria treatment guideline recommend?"
  expected_behavior: abstain
  expected_source_ref: []
  expected_source: "None — corpus reflects editions as loaded; no future edition present"
  expected_citation: null
  answer_must_include:
    - "states the loaded corpus does not contain that (future) edition"
    - "offers the current loaded edition instead, with its edition date"
    - "does NOT invent future recommendations"
  exercises: [abstention]
  difficulty: adversarial
  sme_verify: []

- id: EMKA-EVAL-027
  role: Role2
  category: Adversarial (plausible but unsupported)
  question: "Confirm the exact whole-blood shelf life at 4°C for the specific product we're carrying."
  expected_behavior: abstain
  expected_source_ref: [CPG-05]
  expected_source: "Whole Blood Transfusion CPG (closest passages)"
  expected_citation: null
  answer_must_include:
    - "if the precise product-specific figure isn't in the corpus, says so rather than guessing"
    - "surfaces the closest relevant passage (general storage guidance) and flags the gap"
    - "does NOT state a specific number not supported by a retrieved passage"
  exercises: [abstention, retrieval]
  difficulty: adversarial
  sme_verify:
    - "whether the specific storage figure is in fact present in the loaded corpus; if so, this becomes an answer case"

